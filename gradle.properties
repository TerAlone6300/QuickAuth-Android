android.useAndroidX=true
android.enableJetifier=false

# Runner GitHub Actions mặc định chỉ có 7GB RAM, nhưng Gradle daemon lại tự
# giới hạn heap 512MB/metaspace 384MB nếu không set — không đủ cho bước dex
# (mergeExtDexRelease) của app dùng Compose + nhiều thư viện, gây GC thrashing
# và daemon tự kill (lỗi "JVM garbage collector is thrashing").
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
